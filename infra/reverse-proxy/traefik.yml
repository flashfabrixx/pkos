# Sketch for Traefik v3 in front of docker-compose.prod.yml. Drop into
# /etc/traefik/dynamic/pkos.yml after wiring Traefik's static config
# (entry points, ACME resolver).

http:
  routers:
    pkos:
      rule: "Host(`pkos.example.com`)"
      entryPoints:
        - websecure
      service: pkos
      tls:
        certResolver: letsencrypt
      middlewares:
        - pkos-headers
        - pkos-rate-auth

  services:
    pkos:
      loadBalancer:
        servers:
          - url: "http://pkos-web:3000"
        passHostHeader: true

  middlewares:
    pkos-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
    pkos-rate-auth:
      rateLimit:
        # Match Caddy's /api/auth/* throttle (10 req/min from any single
        # IP). Stops a brute-force of POST /api/auth/login before the
        # rate-limit utility inside PKOS even sees it.
        average: 10
        period: 1m
