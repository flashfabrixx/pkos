# Compose project name is forced to `pkos` regardless of the local
# directory the file is invoked from. Lets the on-disk volume names
# stay clean (`pkos_postgres_data`) even if the repo is checked out
# into a folder called something else.
name: pkos

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pkos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pkos}
      POSTGRES_USER: ${POSTGRES_USER:-pkos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      # Loopback only. To expose Postgres on a LAN/VM interface, change to
      # "0.0.0.0:5433:5432" AFTER putting it behind a firewall.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pkos} -d $${POSTGRES_DB:-pkos}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
