services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bkos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bkos}
      POSTGRES_USER: ${POSTGRES_USER:-bkos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
    # No exposed port: only the app container talks to Postgres over the
    # internal Docker network. Use `docker compose exec postgres psql …`
    # if you need to drop in.
    volumes:
      - bkos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bkos} -d $${POSTGRES_DB:-bkos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${BKOS_IMAGE:-bkos-web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bkos-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Nuxt runtimeConfig is baked at build time but accepts runtime
      # overrides via NUXT_<KEY> env vars (screaming-snake of camelCase).
      # Use those here so the prebuilt image picks up secrets from .env.prod.
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER:-bkos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bkos}
      NUXT_SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      NUXT_USERNAME: ${BKOS_USERNAME:-admin}
      NUXT_PASSWORD_HASH: ${BKOS_PASSWORD_HASH:?BKOS_PASSWORD_HASH must be set}
      NUXT_VAULT_PATH: /data/vault
      NUXT_FILES_PATH: /data/files
      NUXT_MAX_UPLOAD_MB: ${BKOS_MAX_UPLOAD_MB:-25}
      NUXT_EXTRACTOR_PROVIDER: ${BKOS_EXTRACTOR_PROVIDER:-placeholder}
      NUXT_EMBEDDING_PROVIDER: ${BKOS_EMBEDDING_PROVIDER:-placeholder}
      NUXT_OPEN_ROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NUXT_OPEN_ROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      NUXT_OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      NUXT_OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      NUXT_OPEN_AI_API_KEY: ${OPENAI_API_KEY:-}
      NUXT_EMBEDDING_MODEL: ${BKOS_EMBEDDING_MODEL:-}
      # Mail ingest (optional)
      NUXT_MAIL_HOST: ${MAIL_HOST:-}
      NUXT_MAIL_PORT: ${MAIL_PORT:-993}
      NUXT_MAIL_USER: ${MAIL_USER:-}
      NUXT_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      NUXT_MAIL_SECURE: ${MAIL_SECURE:-true}
      NUXT_MAIL_FROM_ALLOW: ${MAIL_FROM_ALLOW:-}
      # SMTP for reminders (optional)
      NUXT_SMTP_HOST: ${SMTP_HOST:-}
      NUXT_SMTP_PORT: ${SMTP_PORT:-587}
      NUXT_SMTP_USER: ${SMTP_USER:-}
      NUXT_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NUXT_SMTP_SECURE: ${SMTP_SECURE:-false}
      NUXT_SMTP_FROM: ${SMTP_FROM:-}
      NUXT_REMINDER_EMAIL: ${BKOS_REMINDER_EMAIL:-}
    volumes:
      - bkos_vault:/data/vault
      - bkos_files:/data/files
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bkos_postgres_data:
  bkos_vault:
  bkos_files:
