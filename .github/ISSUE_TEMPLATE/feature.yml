name: Feature request
description: Propose a new capability or a meaningful change to an existing one.
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, consider whether the [discussions board](https://github.com/marcel-klein/bkos/discussions) is a better fit — small ideas and "would anyone use this?" questions thrive there.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's the user-facing problem? Avoid jumping to a solution.
      placeholder: I can't tell which captures triggered which webhook deliveries.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should BKOS solve this? Sketches and UI screenshots welcome.
      placeholder: A "Deliveries" tab on each webhook subscription showing the last 20 deliveries with status code, response time, response body.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you reject, and why?
      placeholder: Just exposing the raw audit log is too noisy and doesn't group per-subscription.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits BKOS's single-user, self-hosted positioning (not a multi-tenant SaaS feature).
          required: true
